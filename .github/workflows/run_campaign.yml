name: CapitalDecoded Clipper (1-Link Mode)

on:
  workflow_dispatch:
    inputs:
      campaign_url:
        description: "Paste Content Rewards Campaign URL (e.g., https://contentrewards.com/c/campaigns/c0c37381-...)"
        required: true
        type: string
      extra_brief_notes:
        description: "Optional: Paste brief text ONLY if this is a brand-new campaign not in campaigns_db.json"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  auto-clip-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & Python Packages
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp edge-tts google-genai google-api-python-client google-auth-oauthlib requests youtube-transcript-api

      - name: Discover Footage, Clip, Re-Voice & Publish
        env:
          CAMPAIGN_URL: ${{ github.event.inputs.campaign_url }}
          EXTRA_BRIEF_NOTES: ${{ github.event.inputs.extra_brief_notes }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python agent.py

      - name: Save Processed Video History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add used_videos.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Log processed video ID" && git push)
